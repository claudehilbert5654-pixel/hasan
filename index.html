<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE HASAN JOURNEY👑💸</title>
<meta name="theme-color" content="#05060f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --void:#05060f;
  --void2:#0a0b1c;
  --panel:#0d0f24;
  --monarch:#7c3aed;
  --monarch2:#a855f7;
  --arcane:#3b82f6;
  --arcane2:#38bdf8;
  --spectral:#e8e6ff;
  --muted:#9aa0d4;
}
html,body{background:var(--void)}
body{
  font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--spectral);min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;position:relative;overflow:hidden
}

/* monarch aura bleeding in from the top and corners */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 65% 42% at 50% 8%,rgba(124,58,237,.34) 0%,transparent 60%),
    radial-gradient(circle at 8% 92%,rgba(59,130,246,.24) 0%,transparent 46%),
    radial-gradient(circle at 92% 82%,rgba(168,85,247,.20) 0%,transparent 44%)}

/* drifting energy motes */
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%,rgba(168,85,247,.7),transparent),
    radial-gradient(1.5px 1.5px at 70% 20%,rgba(56,189,248,.6),transparent),
    radial-gradient(1.5px 1.5px at 40% 75%,rgba(124,58,237,.6),transparent),
    radial-gradient(1.5px 1.5px at 85% 65%,rgba(56,189,248,.5),transparent),
    radial-gradient(1.5px 1.5px at 15% 60%,rgba(168,85,247,.5),transparent);
  animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-14px)}}

.card{position:relative;z-index:2;width:100%;max-width:412px;
  background:linear-gradient(168deg,var(--panel) 0%,var(--void2) 60%,#0b0817 100%);
  border:1px solid rgba(124,58,237,.32);border-radius:22px;
  padding:34px 24px 28px;text-align:center;
  box-shadow:0 24px 70px rgba(80,20,180,.28),0 4px 22px rgba(0,0,0,.6),inset 0 1px 0 rgba(180,150,255,.10);
  animation:rise .6s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
/* arcane edge along the top */
.card::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--monarch2),var(--arcane2),transparent);opacity:.8}

.crest{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:5px;text-transform:uppercase;color:var(--arcane2);
  opacity:.85;margin-bottom:20px}

/* ── the rising aura around the emblem ── */
.emblem{position:relative;width:130px;height:130px;margin:0 auto 22px}
.aura{position:absolute;inset:-14px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--monarch),var(--arcane),var(--monarch2),var(--arcane2),var(--monarch));
  filter:blur(9px);opacity:.75;animation:spin 4.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;inset:-5px;border-radius:50%;
  background:linear-gradient(135deg,var(--monarch2),var(--arcane) 55%,var(--monarch));
  animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 24px rgba(124,58,237,.55),0 0 46px rgba(59,130,246,.30)}
  50%{box-shadow:0 0 40px rgba(168,85,247,.85),0 0 70px rgba(56,189,248,.45)}}
.face{position:absolute;inset:0;border-radius:50%;z-index:2;
  background:#0b0817 center/cover no-repeat;border:3px solid #0b0817}

h1{font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(27px,8.5vw,34px);letter-spacing:3px;line-height:1.04;
  margin-bottom:6px;
  background:linear-gradient(180deg,#fff 0%,#cbb8ff 48%,var(--monarch2) 130%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 14px rgba(124,58,237,.45))}

.divider{width:60px;height:2px;margin:12px auto 14px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--monarch2),var(--arcane2),transparent)}

.tagline{font-size:15px;font-weight:600;letter-spacing:.6px;color:var(--muted);
  line-height:1.5;margin-bottom:24px}

.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  position:relative;overflow:hidden;cursor:pointer;text-decoration:none;
  background:linear-gradient(135deg,var(--monarch) 0%,#6d28d9 45%,var(--arcane) 100%);
  color:#fff;padding:20px 16px;border-radius:14px;
  border:1px solid rgba(180,150,255,.4);
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:2px;text-transform:uppercase;
  box-shadow:0 14px 34px rgba(90,30,200,.45),inset 0 1px 0 rgba(255,255,255,.28);
  animation:ctaPulse 2.6s ease-in-out infinite;
  transition:transform .12s ease}
@keyframes ctaPulse{
  0%,100%{box-shadow:0 14px 34px rgba(90,30,200,.45),inset 0 1px 0 rgba(255,255,255,.28)}
  50%{box-shadow:0 16px 46px rgba(124,58,237,.68),0 0 30px rgba(56,189,248,.35),inset 0 1px 0 rgba(255,255,255,.34)}}
.cta::before{content:'';position:absolute;top:0;left:-80%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%{left:-80%}55%,100%{left:130%}}
.cta:active{transform:scale(.97)}
.cta:focus-visible{outline:2px solid var(--arcane2);outline-offset:3px}
.cta.busy{opacity:.6;pointer-events:none}

.hint{margin-top:16px;font-size:12px;letter-spacing:.4px;color:var(--muted);opacity:.75}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<main class="card">
  <p class="crest">◆ Arise ◆</p>

  <div class="emblem">
    <div class="aura"></div>
    <div class="ring"></div>
    <div class="face" style="background-image:url('https://i.ibb.co/RpFQCHzn/tg-img-bbiopm.jpg')"
         role="img" aria-label="THE HASAN JOURNEY👑💸"></div>
  </div>

  <h1>THE HASAN JOURNEY👑💸</h1>
  <div class="divider"></div>
  <p class="tagline">Daily market levels and setups. Free to join.</p>

  <a class="cta" id="joinBtn" href="#" rel="noopener">
    Join Telegram <span aria-hidden="true">&#10148;</span>
  </a>

  <p class="hint">Tap to open Telegram and send your request.</p>
</main>

<script>
const VID      = "8f5507f5645c5ca7_1791107115";
const FALLBACK = "https:\/\/t.me\/+1NoOOKrPPzI1NzQ9";
const params   = new URLSearchParams(location.search);
const FBCLID   = params.get('fbclid') || '';
const CAMPAIGN = params.get('utm_campaign') || '';
const AD       = params.get('utm_content') || '';

function serverEvent(type,eid){
  const body=new URLSearchParams({type,vid:VID,eid,fbclid:FBCLID,campaign:CAMPAIGN,ad:AD});
  if(navigator.sendBeacon){navigator.sendBeacon('event.php',body);}
  else{fetch('event.php',{method:'POST',body,keepalive:true}).catch(()=>{});}
}

const vcEid="8f5507f5645c5ca7_1791107115_vc";
fbq('track','ViewContent',{content_name:'landing'},{eventID:vcEid});
serverEvent('ViewContent',vcEid);

let inviteLink=null;
const btn=document.getElementById('joinBtn');

async function getLink(){
  try{
    const r=await fetch('get-link.php?vid='+encodeURIComponent(VID));
    const d=await r.json();
    if(d.link){inviteLink=d.link;btn.href=d.link;}
  }catch(e){}
  if(!inviteLink){inviteLink=FALLBACK;btn.href=FALLBACK;}
}
getLink();

btn.addEventListener('click',function(e){
  e.preventDefault();
  btn.classList.add('busy');
  const eid=VID+'_click';
  const go=()=>{location.href=inviteLink||FALLBACK};

  try{fbq('track','InitiateCheckout',{},{eventID:eid})}catch(err){}
  serverEvent('Click',eid);

  if(inviteLink){setTimeout(go,180);}
  else{getLink().then(()=>setTimeout(go,180));}
});
</script>
